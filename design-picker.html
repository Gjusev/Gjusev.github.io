<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Selector de diseño · portfolio Youssef</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Albert+Sans:wght@400;500;600&family=Bebas+Neue&family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,700&family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=Geist:wght@400;500;600&family=Imbue:opsz,wght@10..100,300;10..100,400&family=Instrument+Serif:ital@0;1&family=STIX+Two+Text:ital,wght@0,400;0,600;1,400&family=Fraunces:opsz,wght@9..144,400;9..144,600&display=swap" rel="stylesheet">
<link href="https://api.fontshare.com/v2/css?f[]=erode@400,500,600&display=swap" rel="stylesheet">
<style>
/* ---------- picker chrome (neutral, not part of the design) ---------- */
*{box-sizing:border-box}
body{margin:0;font:14px/1.45 system-ui,"Segoe UI",sans-serif;background:#e9e9e7;color:#1b1b1b}
.chrome{position:sticky;top:0;z-index:50;background:#1b1b1b;color:#eee;padding:10px 16px;display:flex;gap:14px;flex-wrap:wrap;align-items:end}
.chrome label{display:grid;gap:3px;font-size:12px;color:#aaa}
.chrome select,.chrome button{font:inherit;font-size:14px;padding:6px 8px;border-radius:6px;border:0;background:#2e2e2e;color:#fff;cursor:pointer}
.chrome button.on{background:#fff;color:#111}
.chrome .grow{flex:1}
.chrome code{background:#2e2e2e;padding:6px 8px;border-radius:6px;font-size:12px;color:#c9f;user-select:all}
.notes{max-width:1240px;margin:16px auto;padding:18px 22px;background:#fff;border-radius:10px;display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:22px}
.notes h2{margin:0 0 6px;font-size:20px}
.notes h4{margin:0 0 4px;font-size:12px;color:#666;font-weight:600}
.notes p,.notes ul{margin:0 0 10px}.notes ul{padding-left:18px}
.notes .tag{display:inline-block;background:#eee;border-radius:4px;padding:1px 6px;margin:0 4px 4px 0;font-size:12px}
.notes .warn{color:#a33}
.frame{margin:0 auto 40px;background:#fff;box-shadow:0 2px 30px rgba(0,0,0,.12);transition:width .3s}
.frame.desk{width:min(1280px,calc(100vw - 32px))}
.frame.tab{width:820px}
.frame.phone{width:390px}
.gallery{max-width:1300px;margin:16px auto 60px;display:grid;grid-template-columns:repeat(auto-fill,minmax(400px,1fr));gap:18px;padding:0 16px}
.gal-card{background:#fff;border-radius:10px;overflow:hidden;cursor:pointer;border:3px solid transparent}
.gal-card:hover{border-color:#1b1b1b}
.gal-card .clip{height:250px;overflow:hidden;position:relative}
.gal-card .mini{width:1280px;transform:scale(.3125);transform-origin:0 0;pointer-events:none}
.gal-card p{margin:0;padding:10px 14px;font-weight:600}.gal-card p span{font-weight:400;color:#666}
@media (max-width:900px){.notes{grid-template-columns:1fr}.chrome{position:static}}

/* ---------- the preview: everything below is the actual design ---------- */
.pv{container:pv/inline-size;background:var(--bg);color:var(--ink);font-family:var(--ft);font-size:17px;line-height:1.55;overflow:hidden;-webkit-font-smoothing:antialiased}
.pv *{margin:0}
.pv a{color:inherit}
.pv img{display:block;max-width:100%}
.pv .disp{font-family:var(--fd);font-weight:var(--dw);letter-spacing:var(--dt);line-height:var(--dl);text-transform:var(--du)}
.pv .btn{display:inline-block;background:var(--accent);color:var(--accent-ink);padding:.8em 1.3em;text-decoration:none;font-weight:500;border-radius:var(--rad,0)}
.pv .btn:hover{filter:brightness(1.08)}
.pv .muted{color:var(--muted)}
.pv button.rc{all:unset;cursor:pointer;border-bottom:2px solid var(--accent)}
.pv button.rc:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.pv .receipt{display:none;font-size:15px;color:var(--muted);margin-top:.4em}
.pv .open + .receipt,.pv .open ~ .receipt{display:block}
.pv .M{--m:clamp(16px,3.2cqw,40px);padding-inline:var(--m)}
.pv section{padding-block:clamp(72px,10cqw,160px)}
.pv h2.sec{font-size:clamp(28px,3.4cqw,48px);margin-bottom:clamp(28px,4cqw,56px)}
.pv .bar{display:flex;justify-content:space-between;align-items:center;padding-block:22px;font-size:15px}
.pv .bar nav{display:flex;gap:24px}.pv .bar nav a{text-decoration:none}.pv .bar nav a:hover{color:var(--accent)}

/* A · v0 actual */
.v0 .wrap{display:grid;grid-template-columns:5fr 7fr;gap:4cqw}
.v0 aside{padding-block:96px}
.v0 aside h1{font-size:clamp(40px,4cqw,56px)}
.v0 .role{font-size:19px;margin:8px 0 14px}
.v0 aside nav{display:grid;gap:10px;margin-top:40px;font:12px/1 ui-monospace,monospace;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.v0 main{padding-block:96px}
.v0 h2.lbl{font:12px/1 ui-monospace,monospace;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:22px}
.v0 .card{display:block;padding:16px 18px;margin:0 -18px;border-radius:10px;text-decoration:none}
.v0 .card:hover{background:color-mix(in srgb,var(--ink) 6%,transparent)}
.v0 .card h3{font-size:17px}.v0 .card p{color:var(--muted);font-size:15px}
.v0 .tags span{font:11px ui-monospace,monospace;border:1px solid color-mix(in srgb,var(--ink) 18%,transparent);color:var(--accent);padding:2px 8px;border-radius:99px;margin-right:6px}
.v0 .group{margin-bottom:80px}

/* B · dark room */
.dark .hero{position:relative;padding-block:0}
.dark .hero img{width:100%;height:clamp(320px,52cqw,700px);object-fit:cover;filter:brightness(.8)}
.dark .hero h1{font-size:clamp(64px,17cqw,260px);font-weight:300;margin-top:-.42em;position:relative}
.dark .hero .row{display:grid;grid-template-columns:1fr auto;gap:24px;align-items:end;padding-top:24px}
.dark .hero .row p{font-size:clamp(18px,1.7cqw,24px);max-width:36ch}
.dark .ex{display:grid;grid-template-columns:7fr 5fr;gap:4cqw;align-items:center;margin-bottom:clamp(80px,10cqw,160px)}
.dark .ex:nth-child(even){grid-template-columns:5fr 7fr}.dark .ex:nth-child(even) img{order:2}
.dark .ex img{width:100%;aspect-ratio:16/10;object-fit:cover;filter:brightness(.88)}
.dark .ex h3{font-size:clamp(26px,2.6cqw,38px);margin-bottom:10px}
.dark .num{font-size:clamp(56px,7cqw,104px);margin:22px 0 4px;line-height:1}
.dark .lineup li{list-style:none;display:grid;grid-template-columns:1fr auto;gap:20px;padding:12px 0;font-size:clamp(20px,2.2cqw,30px)}
.dark .lineup{padding:0}
.dark .lineup li span:last-child{color:var(--muted)}
.dark footer{padding-block:80px 24px}
.dark footer .wm{font-size:clamp(64px,16cqw,240px);color:var(--accent);line-height:.85;margin-top:48px}

/* C · quiet instrument */
.quiet .col{margin-left:22cqw;max-width:560px}
.quiet .hero{padding-top:28cqh;padding-top:clamp(120px,16cqw,240px)}
.quiet .hero h1{font-size:clamp(34px,5.4cqw,76px);max-width:14ch;margin-bottom:28px}
.quiet .hero p{font-size:19px;margin-bottom:28px}
.quiet .grid2{display:grid;grid-template-columns:22cqw 560px 1fr;gap:0}
.quiet .ledger{padding:0;grid-column:2}
.quiet .ledger li{list-style:none}
.quiet .ledger a{display:grid;grid-template-columns:1fr auto;gap:16px;padding:14px 0;text-decoration:none;background:linear-gradient(var(--surface),var(--surface)) no-repeat 0 100%/100% 0;transition:background-size .2s}
.quiet .ledger a:hover{background-size:100% 100%}
.quiet .ledger small{display:block;color:var(--muted);font-size:15px}
.quiet .ledger b{font-weight:600;font-variant-numeric:tabular-nums}
.quiet .peek{grid-column:3;position:sticky;top:80px;align-self:start;padding-left:40px}
.quiet .peek img{width:100%;max-width:420px;aspect-ratio:4/3;object-fit:cover;opacity:0;transition:opacity .25s}
.quiet .peek img.on{opacity:1}
.quiet .tile{background:var(--f1);color:var(--f1i);padding-block:clamp(48px,6cqw,96px)}
.quiet .tile p{font-size:clamp(24px,2.6cqw,36px);line-height:1.25;max-width:24ch}
.quiet footer{padding-block:60px;font-size:15px;color:var(--muted)}

/* D · the page is the object (technical report) */
.obj{background:var(--surface)}
.obj .sheet{background:var(--bg);max-width:980px;margin:clamp(16px,4cqw,64px) auto;padding:clamp(28px,6cqw,96px) clamp(20px,7cqw,110px)}
.obj .meta{display:flex;justify-content:space-between;font-size:15px;color:var(--muted);margin-bottom:clamp(48px,6cqw,90px)}
.obj h1{font-size:clamp(40px,5.6cqw,78px);max-width:16ch;margin-bottom:22px}
.obj .authors{font-size:19px;margin-bottom:48px}
.obj h2{font-family:var(--fd);font-size:24px;font-weight:600;margin:56px 0 14px}
.obj .abstract{display:grid;grid-template-columns:1fr 1fr;gap:32px}
.obj table{width:100%;border-collapse:collapse;font-size:16px}
.obj th{text-align:left;font-weight:600;padding:10px 8px;border-bottom:2px solid var(--ink)}
.obj td{padding:10px 8px;border-bottom:1px solid color-mix(in srgb,var(--ink) 20%,transparent);vertical-align:top}
.obj td.r{font-family:var(--fd);font-size:22px;white-space:nowrap}
.obj figure{margin:40px 0}
.obj .print{background:var(--accent);display:block}
.obj .print img{mix-blend-mode:screen;filter:grayscale(1) invert(1) contrast(1.2);width:100%}
.obj figcaption{font-size:15px;color:var(--muted);margin-top:10px}
.obj .figs{display:grid;grid-template-columns:1fr 1fr;gap:28px}
.obj .figs figure{margin:0}.obj .figs img{aspect-ratio:4/3;object-fit:cover;width:100%;object-position:top}
.obj ol{padding-left:1.3em}.obj ol li{margin-bottom:8px}
.obj .back{background:var(--ink);color:var(--bg);max-width:980px;margin:0 auto clamp(16px,4cqw,64px);padding:clamp(28px,5cqw,64px) clamp(20px,7cqw,110px);display:flex;justify-content:space-between;flex-wrap:wrap;gap:20px}
.obj .back .disp{font-size:clamp(36px,5cqw,64px)}

/* E · sentence is the layout */
.sent .hero{min-height:clamp(520px,62cqw,820px);display:grid;grid-template-rows:auto 1fr auto;padding-block:0 28px}
.sent .hero h1{align-self:center;font-size:clamp(56px,10.5cqw,168px);display:flex;flex-wrap:wrap;align-items:baseline;gap:0 .22em}
.sent .frame-in{display:inline-block;width:1.7em;height:.74em;overflow:hidden;border-radius:.08em}
.sent .frame-in img{width:100%;height:100%;object-fit:cover}
.sent .foot{display:grid;grid-template-columns:5fr 7fr;gap:24px;align-items:end}
.sent .foot p{font-size:17px;max-width:44ch;grid-column:2}
.sent .foot a{grid-column:2}
.sent .claim{display:grid;grid-template-columns:6fr 6fr;gap:4cqw;align-items:center}
.sent .claim h2{font-size:clamp(34px,4.6cqw,68px)}
.sent .claim p{font-size:19px;margin-top:18px;max-width:40ch}
.sent .claim img{width:100%;aspect-ratio:16/10;object-fit:cover;border-radius:10px}
.sent .proof{background:var(--surface);padding:clamp(28px,4cqw,56px);border-radius:10px}
.sent .proof .big{font-size:clamp(64px,9cqw,140px);line-height:1}
.sent .names{font-size:clamp(28px,4.2cqw,60px);line-height:1.15}
.sent .names a{text-decoration:none}.sent .names a:hover{color:var(--muted)}
.sent .names span{color:var(--muted)}
.sent footer{position:relative;padding-top:80px;overflow:hidden}
.sent footer p{font-size:clamp(22px,2.4cqw,32px);max-width:24ch;margin-bottom:24px}
.sent footer .crop{font-size:clamp(100px,24cqw,380px);line-height:.75;margin-bottom:-.12em;white-space:nowrap}

/* F · type only */
.type .hero{position:relative;height:clamp(600px,64cqw,860px);padding-block:0;overflow:hidden}
.type .hero .top{display:grid;grid-template-columns:1fr auto;padding-top:22px}
.type .hero .lead{margin-top:clamp(40px,7cqw,96px);font-size:clamp(20px,1.8cqw,26px);max-width:34ch;line-height:1.35}
.type .hero .btn{margin-top:22px}
.type .word{position:absolute;left:-6cqw;bottom:-6%;font-size:clamp(220px,40cqw,640px);line-height:.8;white-space:nowrap;color:var(--accent)}
.type .tiles{display:grid;grid-template-columns:repeat(4,1fr);padding:0}
.type .tiles>div{padding:clamp(24px,3cqw,44px);min-height:clamp(260px,26cqw,380px);display:flex;flex-direction:column;justify-content:space-between}
.type .tiles .big{font-family:var(--fd);font-size:clamp(64px,8cqw,128px);line-height:.9;font-weight:var(--dw);letter-spacing:var(--dt)}
.type .tiles p{font-size:18px}
.type .t1{background:var(--f1);color:var(--f1i)}.type .t2{background:var(--f2);color:var(--f2i)}.type .t3{background:var(--f3);color:var(--f3i)}.type .t4{background:var(--f4);color:var(--f4i)}
.type .caps{padding:0;list-style:none}
.type .caps li{font-size:clamp(44px,6cqw,96px)}
.type .pics{display:grid;grid-template-columns:7fr 5fr;gap:3cqw;align-items:end}
.type .pics img{width:100%;object-fit:cover}
.type .pics p{font-size:16px;margin-top:10px}
.type .two{display:grid;grid-template-columns:1fr 1fr;gap:4cqw}
.type .two p{font-size:clamp(22px,2.4cqw,32px);line-height:1.3}
.type .two mark{background:var(--f3);color:var(--f3i)}
.type footer{padding-top:60px;overflow:hidden}
.type footer .crop{font-size:clamp(140px,30cqw,480px);line-height:.75;margin-bottom:-.1em;white-space:nowrap}

/* shared: writing rows */
.pv .posts{list-style:none;padding:0}
.pv .posts a{display:grid;grid-template-columns:8em 1fr;gap:20px;padding:16px 0;text-decoration:none}
.pv .posts a:hover h3{color:var(--accent)}
.pv .posts h3{font-size:clamp(20px,1.9cqw,26px);font-weight:500;font-family:var(--fd)}
.pv .posts time{color:var(--muted);font-size:15px;padding-top:4px}
.pv .posts p{color:var(--muted);font-size:16px}

/* ---------- phone composition ---------- */
@container pv (max-width:640px){
  .v0 .wrap,.dark .ex,.dark .ex:nth-child(even),.sent .claim,.sent .foot,.type .pics,.type .two,.obj .abstract,.obj .figs{grid-template-columns:1fr}
  .dark .ex:nth-child(even) img{order:0}
  .v0 aside{padding-block:48px 0}.v0 aside nav{display:none}.v0 main{padding-block:32px}
  .quiet .col{margin-left:0}.quiet .grid2{grid-template-columns:1fr}.quiet .ledger{grid-column:1}.quiet .peek{display:none}
  .quiet .hero{padding-top:96px}
  .sent .hero h1{font-size:19cqw;flex-direction:column;align-items:flex-start}
  .sent .frame-in{width:100%;height:auto;aspect-ratio:3/2;border-radius:6px}
  .sent .foot p,.sent .foot a{grid-column:1}
  .type .tiles{grid-template-columns:1fr 1fr}
  .type .word{writing-mode:vertical-rl;font-size:62cqw;left:auto;right:-14cqw;bottom:auto;top:-4%}
  .type .hero .lead{max-width:55%}
  .pv .bar nav{gap:14px;font-size:14px}
  .pv .posts a{grid-template-columns:1fr;gap:4px}
  .obj .meta{flex-direction:column;gap:4px}
  .obj table{font-size:14px}.obj td.r{font-size:18px}.obj th:nth-child(3),.obj td:nth-child(3){display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="chrome">
  <label>Dirección<select id="dir"></select></label>
  <label>Tipografía<select id="type"></select></label>
  <label>Paleta<select id="pal"></select></label>
  <label>Esquinas<select id="rad"><option value="0">Rectas</option><option value="999px">Píldora</option><option value="10px">Suaves</option></select></label>
  <label>Ancho<span style="display:flex;gap:4px"><button data-w="desk" class="on">Escritorio</button><button data-w="tab">Tablet</button><button data-w="phone">Móvil</button></span></label>
  <label>Vista<span style="display:flex;gap:4px"><button id="gal">Galería de las 6</button><button id="reset">Combo recomendado</button></span></label>
  <span class="grow"></span>
  <label>Dime esta combinación<code id="code"></code></label>
</div>

<div class="notes" id="notes"></div>
<div id="gallery" class="gallery" hidden></div>
<div id="frame" class="frame desk"><div id="pv" class="pv"></div></div>

<script>
const IMG = "assets/work/";
const GH = n => "https://github.com/Gjusev/" + n;

/* Real projects. Every number is copied from the repo's own README/description. */
const P = [
  {n:"forecast-arena", w:"Eight forecasting models, four real German arenas, every number published.", v:"19.27", u:"MAE, best of eight", r:"Chronos-2 on day-ahead price, DE bidding zone. Seasonal naive scores 28.20.", img:"forecast-chart.png"},
  {n:"laya-triage", w:"Local support-ticket routing that knows when to hand a ticket to a person.", v:"0.84", u:"confidence to close a ticket", r:"Measured on BANKING77 test · seed 13 · n=200.", img:"laya-triage.jpg"},
  {n:"voice-evals", w:"Replay calls or probe a live voice agent; gate CI on WER, latency and barge-in.", v:"PyPI", u:"pip install voice-evals", r:"Python CLI and library, Apache-2.0.", img:"voice-evals.jpg"},
  {n:"treeseek", w:"Retrieval that walks a topic tree instead of scanning every vector.", v:"74", u:"comparisons instead of 3,000", r:"Same Recall@1 as flat dense retrieval on 20 Newsgroups."},
  {n:"zerocall", w:"Skip the model call when nothing changed: guarded decision reuse for agents.", v:"4 → 0", u:"model calls on a warm rerun", r:"1,092 tokens to 0. Python, stdlib only."},
  {n:"trust-but-verify", w:"Four ways to check a coding agent's work, priced in pass rate and tokens.", v:"+5", u:"points at 1.5× tokens", r:"Test gate on HumanEval with glm-4.5-flash. A reviewer agent gets the same +5 at 3.56×."},
  {n:"laya-compactor", w:"Fit retrieved evidence to a token budget with one local forward pass.", v:"−70%", u:"RAG context tokens", r:"Zero answer-quality loss, measured."},
  {n:"MK-SH-V", w:"A 260M visual decision model that refuses below a validated gate.", v:"260M", u:"parameters", r:"Calibrated probabilities over document pages and screenshots.", img:"mk-sh-v.png"},
  {n:"skill-issue", w:"Runs a task with and without an agent skill and shows the evidence.", v:"npm", u:"skill-issue-tool", r:"Local harness, TypeScript.", img:"skill-issue.png"},
  {n:"note-lm", w:"A local research notebook where every claim traces back to its passage.", v:"MIT", u:"Windows desktop", r:"Local storage and models.", img:"note-lm.png"},
  {n:"hard-mode", w:"Your demo meets real life: a Playwright runner for difficult UI scenarios.", v:"TS", u:"runner + agent skill", r:"Reproducible evidence, before and after.", img:"hard-mode.png"},
];
const POSTS = [
  {t:"Who checks the coding agent's work?", d:"Four verification strategies, measured on pass rate and token cost.", date:"Nov 2026"},
  {t:"Sample: why I publish negative results", d:"Placeholder title to show density. Replace before launch.", date:"Oct 2026"},
  {t:"Sample: calibration is a product feature", d:"Placeholder title to show density. Replace before launch.", date:"Sep 2026"},
];
const NUMS = P.filter(p => /\d/.test(p.v));
const withImg = P.filter(p => p.img && p.n !== "MK-SH-V");
const rc = (p, cls = "") => `<button class="rc ${cls}" aria-expanded="false">${p.v}</button><span class="receipt">${p.r}</span>`;
const posts = () => `<ul class="posts">${POSTS.map(p => `<li><a href="#"><time>${p.date}</time><div><h3>${p.t}</h3><p>${p.d}</p></div></a></li>`).join("")}</ul>`;
const bar = (wm = "Youssef") => `<header class="bar M"><a href="#" style="text-decoration:none;font-weight:600">${wm}</a><nav><a href="#">Work</a><a href="#">Writing</a><a href="#">GitHub</a><a href="#">Contact</a></nav></header>`;

/* ---------- typography ---------- */
const TYPES = {
  imbue:{l:"Imbue + Albert Sans", fd:"'Imbue',serif", ft:"'Albert Sans',sans-serif", dw:300, dt:"-0.01em", dl:.9, du:"uppercase", note:"Serif condensada de alto contraste, tipo cabecera de revista. Elegante, nocturna."},
  stix:{l:"STIX Two Text", fd:"'STIX Two Text',serif", ft:"'STIX Two Text',serif", dw:400, dt:"-0.026em", dl:1.1, du:"none", note:"Romana de documento, casi 'sin diseñar'. Suena a paper, a memo serio."},
  erode:{l:"Erode", fd:"'Erode',serif", ft:"'Erode',serif", dw:500, dt:"-0.025em", dl:.95, du:"none", note:"Serif con remates en cuña. Editorial, de informe técnico, firme en texto."},
  bricolage:{l:"Bricolage Grotesque", fd:"'Bricolage Grotesque',sans-serif", ft:"'Bricolage Grotesque',sans-serif", dw:600, dt:"-0.04em", dl:.92, du:"none", note:"Grotesca con contraste e irregularidad: cálida, dibujada, muy 2026."},
  bebas:{l:"Bebas Neue + EB Garamond", fd:"'Bebas Neue',sans-serif", ft:"'EB Garamond',serif", dw:400, dt:"-0.01em", dl:.85, du:"uppercase", note:"Mayúsculas industriales enormes contra una serif literaria. Póster."},
  geist:{l:"Geist", fd:"'Geist',sans-serif", ft:"'Geist',sans-serif", dw:600, dt:"-0.045em", dl:.95, du:"none", note:"La sans de Vercel. Precisa, técnica, la más 'dev tool' de todas."},

/* ---------- state ---------- */
const $ = id => document.getElementById(id);
const opts = (sel, o) => sel.innerHTML = Object.entries(o).map(([k,v]) => `<option value="${k}">${v.l}</option>`).join("");
opts($("dir"), DIRS); opts($("type"), TYPES); opts($("pal"), PALS);
const S = Object.fromEntries(new URLSearchParams(location.hash.slice(1)));
const st = {dir:S.dir||"obj", type:S.type, pal:S.pal, rad:S.rad||"0", w:"desk"};
if (!st.type) st.type = DIRS[st.dir].type; if (!st.pal) st.pal = DIRS[st.dir].pal;

function vars(type, pal, rad) {
  const t = TYPES[type], c = PALS[pal].c, f = (i, d) => c[i] ?? c[d];
  return `--fd:${t.fd};--ft:${t.ft};--dw:${t.dw};--dt:${t.dt};--dl:${t.dl};--du:${t.du};--rad:${rad};--bg:${c[0]};--surface:${c[1]};--ink:${c[2]};--muted:${c[3]};--accent:${c[4]};--accent-ink:${c[5]};--f1:${c[6]};--f1i:${c[7]};--f2:${c[8]};--f2i:${c[9]};--f3:${f(10,6)};--f3i:${f(11,7)};--f4:${f(12,8)};--f4i:${f(13,9)}`;
}
function render() {
  $("dir").value = st.dir; $("type").value = st.type; $("pal").value = st.pal; $("rad").value = st.rad;
  const pv = $("pv"); pv.setAttribute("style", vars(st.type, st.pal, st.rad)); pv.innerHTML = T[st.dir]();
  const d = DIRS[st.dir], t = TYPES[st.type];
  const rec = st.type === d.type && st.pal === d.pal;
  $("notes").innerHTML = `<div><h2>${d.l}</h2><p>${d.idea}</p><h4>Por qué encaja contigo</h4><p>${d.why}</p></div>
  <div><h4>Riesgo</h4><p class="warn">${d.risk}</p><h4>Elemento vivo</h4><p>${d.live}</p><h4>Referencias</h4><p>${d.refs.map(r=>`<span class="tag">${r}</span>`).join("")}</p></div>
  <div><h4>Tipografía: ${t.l}</h4><p>${t.note}</p><h4>Paleta: ${PALS[st.pal].l}</h4><p>${PALS[st.pal].c.slice(0,6).map(x=>`<span class="tag" style="background:${x};color:${x};border:1px solid #ccc">■■</span>`).join("")}</p><p>${rec ? "✓ Combo recomendado para esta dirección." : "Combinación libre (la recomendada: " + TYPES[d.type].l + " + " + PALS[d.pal].l + ")."}</p></div>`;
  const h = `dir=${st.dir}&type=${st.type}&pal=${st.pal}&rad=${st.rad}`;
  $("code").textContent = h; history.replaceState(null, "", "#" + h);
  wire(pv);
}
function wire(root) {
  root.querySelectorAll("button.rc").forEach(b => b.onclick = () => { b.classList.toggle("open"); b.setAttribute("aria-expanded", b.classList.contains("open")); });
  const peek = root.querySelector(".peek img");
  if (peek) root.querySelectorAll(".ledger a").forEach(a => {
    const on = () => { if (a.dataset.img) { peek.src = IMG + a.dataset.img; peek.alt = a.textContent; peek.classList.add("on"); } else peek.classList.remove("on"); };
    a.onmouseenter = on; a.onfocus = on;
  });
}
$("dir").onchange = e => { st.dir = e.target.value; st.type = DIRS[st.dir].type; st.pal = DIRS[st.dir].pal; render(); };
$("type").onchange = e => { st.type = e.target.value; render(); };
$("pal").onchange = e => { st.pal = e.target.value; render(); };
$("rad").onchange = e => { st.rad = e.target.value; render(); };
$("reset").onclick = () => { st.type = DIRS[st.dir].type; st.pal = DIRS[st.dir].pal; render(); };
document.querySelectorAll("[data-w]").forEach(b => b.onclick = () => {
  document.querySelectorAll("[data-w]").forEach(x => x.classList.toggle("on", x === b));
  $("frame").className = "frame " + b.dataset.w;
});
$("gal").onclick = () => {
  const g = $("gallery"), show = g.hidden; g.hidden = !show; $("gal").classList.toggle("on", show);
  if (show) {
    g.innerHTML = Object.entries(DIRS).map(([k, d]) => `<div class="gal-card" data-k="${k}"><div class="clip"><div class="mini pv" style="${vars(d.type, d.pal, "0")}">${T[k]()}</div></div><p>${d.l} <span>· ${TYPES[d.type].l} · ${PALS[d.pal].l}</span></p></div>`).join("");
    g.querySelectorAll(".gal-card").forEach(c => c.onclick = () => { st.dir = c.dataset.k; st.type = DIRS[st.dir].type; st.pal = DIRS[st.dir].pal; g.hidden = true; $("gal").classList.remove("on"); render(); scrollTo(0, 0); });
  }
};
render();
</script>
